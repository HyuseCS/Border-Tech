<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/> 
      <stop offset="100%" stop-color="#020617"/> 
    </linearGradient>
    
    <linearGradient id="trion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <g id="core-shard">
      <polygon points="0,35 45,60 45,110 0,85" fill="#38BDF8" opacity="0.9"/>
      <polygon points="45,60 90,35 90,85 45,110" fill="#0284C7" opacity="1"/>
      <polygon points="0,35 45,10 90,35 45,60" fill="#E0FFFF" opacity="1"/>
      <circle cx="45" cy="55" r="10" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <g transform="translate(0, 10)">
    
    <g fill="none" stroke="url(#trion)" stroke-linecap="round" opacity="0.3">
      <path d="M 126 120 A 180 180 0 0 0 126 380" stroke-width="4" />
      <path d="M 386 120 A 180 180 0 0 1 386 380" stroke-width="4" />
    </g>

    <g fill="none" stroke="url(#trion)" stroke-linecap="round" opacity="0.6">
      <path d="M 166 160 A 120 120 0 0 0 166 340" stroke-width="8" />
      <path d="M 346 160 A 120 120 0 0 1 346 340" stroke-width="8" />
    </g>

    <g fill="none" stroke="#00F0FF" stroke-linecap="round" opacity="0.9">
      <path d="M 206 200 A 60 60 0 0 0 206 300" stroke-width="12" />
      <path d="M 306 200 A 60 60 0 0 1 306 300" stroke-width="12" />
    </g>

    <g transform="translate(211, 190)">
      <use href="#core-shard"/>
    </g>

    <circle cx="256" cy="400" r="4" fill="#00F0FF"/>
    
    <circle cx="256" cy="100" r="4" fill="#00F0FF"/>
  </g>
</svg>
