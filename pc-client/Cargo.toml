[package]
name = "project-m"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2.186"
pipewire = { version = "0.10.0", package = "pipewire" }
pw_sys = { version = "0.10.0", package = "pipewire-sys" }
rcgen = "0.14.8"
ringbuf = "0.5.0"
rustls = "0.23.40"
rustls-pemfile = "2.2.0"
scopeguard = "1.2.0"
slint = "1.16.1"
spa_sys = { version = "0.10.0", package = "libspa-sys" }
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
slint-build = "1.16.1"

[dev-dependencies]
tokio-test = "0.4.5"
