[package]
name = "project-m"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
opus = "0.3.1"
pipewire = { version = "0.10.0", package = "pipewire" }
pw_sys = { version = "0.10.0", package = "pipewire-sys" }
ringbuf = "0.5.0"
scopeguard = "1.2.0"
slint = "1.16.1"
spa_sys = { version = "0.10.0", package = "libspa-sys" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
slint-build = "1.16.1"

[dev-dependencies]
tokio-test = "0.4.5"
